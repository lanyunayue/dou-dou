[package]
name = "dou-gateway"
version = "0.1.0"
edition = "2021"
description = "Dou local MCP gateway for controlled agent access"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
sha2 = "0.11.1"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
