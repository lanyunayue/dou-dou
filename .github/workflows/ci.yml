name: dou-gateway CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows-only project in this phase; GNU is mandatory, MSVC is conditional.
# The repository path may contain non-ASCII characters, so CARGO_TARGET_DIR
# always points to an ASCII location (see .cargo/config.toml).
env:
  CARGO_TARGET_DIR: D:/a/dou-target
  CARGO_TERM_COLOR: never

jobs:
  gnu:
    name: GNU (required)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install MinGW (dlltool required by windows-sys)
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        run: cargo build --locked
      - name: Unit + integration tests
        run: cargo test --locked -- --nocapture
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Frontend typecheck
        working-directory: app
        run: |
          npm ci
          npm run build

  msvc:
    name: MSVC (conditional, native toolchain present)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build (MSVC)
        run: cargo build --locked
      - name: Test (MSVC)
        run: cargo test --locked

  secrets-scan:
    name: No plaintext credentials in history
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Reject real token literals
        shell: pwsh
        run: |
          $hits = git grep -n -E 'dou_ak_[0-9a-f]{24,}' -- . ':!docs' 2>$null
          if ($hits) { Write-Error "plaintext credential found: $hits"; exit 1 }
          Write-Output "OK: no plaintext credential literals"
