# 项目级工具链锁定（rustup 会自动读取）
#
# 为什么固定 MSVC：
#   1. 之前用 MinGW/GNU 构建时，cdylib 生成 app_lib.dll 触发
#      `ld.exe: error: export ordinal too large`（导出符号超出 PE 序号上限）。
#   2. MSVC (link.exe) 是 Tauri / Windows 官方推荐工具链，无此限制，
#      且能直接对接已安装的 Visual Studio 2026 Community 做调试。
#   3. 旧机含中文的路径会让 MinGW 的 dlltool 按 ANSI 解析路径失败，
#      MSVC 不受影响。
#
# 注意：网关 workspace 仍由 build.ps1 显式使用
#       `cargo +stable-x86_64-pc-windows-gnu`，不受本文件影响。

[toolchain]
channel = "stable-x86_64-pc-windows-msvc"
profile = "default"
