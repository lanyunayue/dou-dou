# 本机构建配置（Windows + MinGW）
#
# 为什么 target-dir 在项目外：项目位于 E:\思考\dou，含中文路径。
# rustc 传给 dlltool 的参数是 UTF-8，而 MinGW 的 dlltool 按 ANSI 代码页解释，
# 中文路径会变成 E:\˼�� 导致 “Can't create .lib file”。把产物放到纯 ASCII 路径即可绕开。
#
# 换机器时需要改 linker/ar 的绝对路径，或改用 MSVC 工具链（官方推荐，无此问题）。

[build]
target-dir = "E:/dou-target"

[target.x86_64-pc-windows-gnu]
linker = "C:/Users/mrhua/AppData/Local/Microsoft/WinGet/Packages/BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe/mingw64/bin/x86_64-w64-mingw32-gcc.exe"
ar = "C:/Users/mrhua/AppData/Local/Microsoft/WinGet/Packages/BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe/mingw64/bin/ar.exe"
